<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="进销账" />
<meta name="theme-color" content="#0f766e" />
<title>进销账</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="stylesheet" href="ledger.css" />
</head>
<body>
<main id="app">
  <section class="page" id="page-home"></section>
  <section class="page" id="page-trade" hidden></section>
  <section class="page" id="page-receipt" hidden></section>
  <section class="page" id="page-company" hidden></section>
  <section class="page" id="page-settings" hidden></section>
</main>

<nav class="tabbar"></nav>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-mask" data-close></div>
  <div class="sheet-body" role="dialog" aria-modal="true">
    <div class="sheet-hd"><h2 id="sheet-title"></h2><button class="x" data-close aria-label="关闭">✕</button></div>
    <div id="sheet-content"></div>
  </div>
</div>

<div id="ask" class="ask" hidden></div>
<div id="toast" class="toast" hidden></div>

<script type="module" src="boot.js"></script>
</body>
</html>
